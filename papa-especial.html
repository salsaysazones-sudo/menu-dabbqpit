<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-dark: #0a0705;
    --bg-board: #14100c;
    --chalk: #f5f0e8;
    --chalk-cream: #e8dcc0;
    --chalk-yellow: #ffd966;

  }

  body {
    background: var(--bg-dark);

    overflow-x: hidden;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at center bottom, rgba(217,76,44,0.18) 0%, transparent 55%),
      radial-gradient(ellipse at center top, rgba(255,133,51,0.06) 0%, transparent 60%),
      var(--bg-dark);
  }

  .smoke-layer {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 1;
    overflow: hidden;
  }
  .smoke {
    position: absolute;
    bottom: -150px;
    width: 180px; height: 350px;
    background: radial-gradient(ellipse at center bottom, rgba(255,255,255,0.06) 0%, transparent 70%);
    border-radius: 50%;
    filter: blur(8px);
    animation: rise 18s infinite linear;
  }
  .smoke.warm {
    background: radial-gradient(ellipse at center bottom, rgba(255,133,51,0.08) 0%, transparent 70%);
  }
  @keyframes rise {
    0%   { transform: translate(0,0) scale(1); opacity: 0; }
    15%  { opacity: 1; }
    100% { transform: translate(20px,-110vh) scale(2.8); opacity: 0; }
  }

  .hero {
    position: relative; z-index: 2;

    display: flex; flex-direction: column;

  .logo {

    color: var(--chalk);

      0 0 20px rgba(217,76,44,0.7),

  .tagline {
    margin-top: 10px;

  }
  .ornament {
    display: inline-block; margin: 0 14px;
    color: var(--chalk-yellow); transform: translateY(-2px);
  }

  .board-wrap {
    position: relative; padding: 18px;
    background: linear-gradient(135deg, var(--wood-dark) 0%, var(--wood-light) 50%, var(--wood-dark) 100%);
    border-radius: 14px;
    box-shadow:
      0 0 0 3px rgba(0,0,0,0.6),
      0 0 0 5px rgba(255,255,255,0.04),
      0 25px 70px rgba(0,0,0,0.8),
      0 0 60px rgba(217,76,44,0.15),
      inset 0 0 30px rgba(0,0,0,0.5);
  }
  .board-wrap::before {
    content: ''; position: absolute; inset: 0;
    border-radius: 14px;
    background: repeating-linear-gradient(
      90deg,
      transparent 0, transparent 7px,
      rgba(0,0,0,0.12) 7px, rgba(0,0,0,0.12) 8px,

  .bolt {
    position: absolute; width: 14px; height: 14px;

    z-index: 2;
  }
  .bolt.tl { top: 8px; left: 8px; }
  .bolt.tr { top: 8px; right: 8px; }
  .bolt.bl { bottom: 8px; left: 8px; }
  .bolt.br { bottom: 8px; right: 8px; }
  .board-wrap::after {
    content: ''; position: absolute;
    bottom: -20px; left: 50%; transform: translateX(-50%);
    width: 60%; height: 30px;
    background: radial-gradient(ellipse at center, rgba(255,100,50,0.4) 0%, transparent 70%);
    filter: blur(8px); pointer-events: none;

  @keyframes flicker {
    0%,100% { opacity: 0.7; transform: translateX(-50%) scale(1,1); }

  }

  canvas {
    display: block;
    border-radius: 4px;
    background: var(--bg-board);
    max-width: 100%;
    max-height: 62vh;
    width: auto;
    height: auto;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8);

  .cta-section {
    display: flex; flex-direction: column;

  }

  .old-price { color: rgba(255,255,255,0.35); text-decoration: line-through; font-size: 0.95rem; }
  .new-price {
    color: var(--chalk-yellow);

  }
  .cta-btn {
    background: linear-gradient(135deg, var(--chalk-red) 0%, var(--chalk-orange) 100%);
    color: #fff; border: none;
    padding: 15px 44px;
    font-size: 1.05rem; font-weight: 900;
    letter-spacing: 0.2em;
    cursor: pointer; border-radius: 4px;
    font-family: 'Courier New', monospace;
    box-shadow:

      inset 0 1px 0 rgba(255,255,255,0.3);

    text-transform: uppercase;
  }
  .cta-btn:hover {
    transform: translateY(-2px);
    box-shadow:
      0 0 35px rgba(217,76,44,0.9),

  }
  .cta-btn:active {
    transform: translateY(3px);
    box-shadow: 0 0 20px rgba(217,76,44,0.6), 0 2px 0 rgba(0,0,0,0.5);
  }
  .restart-link {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.18);
    color: rgba(255,255,255,0.5);
    padding: 8px 18px;
    font-size: 0.7rem; letter-spacing: 0.18em;

  .hours {

  .hours strong {
    color: var(--chalk-orange);

  }
  .hours .wa-link {

  .hours .wa-link:hover {

  @media (max-width: 650px) {

    canvas { max-height: 45vh; }
    .tagline { font-size: 0.6rem; }

  }
</style>

<script>
const PRECIO_NORMAL = '$90.00 $85.00';
const PRECIO_OFERTA = '$45.00 $43.00';
const WHATSAPP = '524771483773';

document.getElementById('oldPrice').textContent = PRECIO_NORMAL;
document.getElementById('newPrice').textContent = PRECIO_OFERTA;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

let startTime = null;
const DURATION = 5500;

function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOut(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }

const COL = {
  chalk:    '245,240,232',
  cream:    '232,220,192',
  yellow:   '255,217,102',
  orange:   '255,133,51',
  red:      '217,76,44',
  brown:    '139,69,30',
  darkbrown:'101,50,20'
};

/* ===== Fondo pizarra ===== */
const bgCanvas = document.createElement('canvas');
bgCanvas.width = W; bgCanvas.height = H;
const bgCtx = bgCanvas.getContext('2d');

function buildBackground() {
  bgCtx.fillStyle = '#14100c';
  bgCtx.fillRect(0, 0, W, H);
  for (let i = 0; i < 1600; i++) {
    bgCtx.fillStyle = `rgba(255,240,220,${Math.random()*0.05})`;
    const s = Math.random() * 2.5;
    bgCtx.fillRect(Math.random()*W, Math.random()*H, s, s);
  }
  for (let i = 0; i < 30; i++) {
    const x = Math.random()*W, y = Math.random()*H;
    const r = 25 + Math.random()*80;
    const grad = bgCtx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(255,220,180,${Math.random()*0.025})`);
    grad.addColorStop(1, 'rgba(255,220,180,0)');
    bgCtx.fillStyle = grad;
    bgCtx.beginPath();
    bgCtx.arc(x, y, r, 0, Math.PI*2);
    bgCtx.fill();
  }
  bgCtx.strokeStyle = 'rgba(255,240,220,0.08)';
  bgCtx.lineWidth = 4;
  bgCtx.strokeRect(2, 2, W-4, H-4);

  bgCtx.fillStyle = 'rgba(255,217,102,0.4)';
  bgCtx.font = 'bold 13px Courier New';
  bgCtx.textAlign = 'center';
  bgCtx.fillText('— ESPECIAL DE HOY —', W/2, 25);
  bgCtx.strokeStyle = 'rgba(255,217,102,0.25)';
  bgCtx.lineWidth = 1;
  bgCtx.beginPath();
  bgCtx.moveTo(W/2 - 110, 30); bgCtx.lineTo(W/2 - 80, 30);
  bgCtx.moveTo(W/2 + 80, 30);  bgCtx.lineTo(W/2 + 110, 30);
  bgCtx.stroke();
}
buildBackground();

/* ===== Trazos de tiza ===== */
function chalkLine(x1, y1, x2, y2, width = 2, color = COL.chalk, alpha = 0.9) {
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx*dx + dy*dy);
  const steps = Math.max(2, Math.floor(len / 2));
  ctx.beginPath();
  ctx.moveTo(x1 + (Math.random()-0.5)*1.5, y1 + (Math.random()-0.5)*1.5);
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    const x = x1 + dx*t + (Math.random()-0.5)*2;
    const y = y1 + dy*t + (Math.random()-0.5)*2;
    ctx.lineTo(x, y);
  }
  ctx.strokeStyle = `rgba(${color},${alpha*0.3})`;
  ctx.lineWidth = width + 2.5;
  ctx.stroke();
  ctx.strokeStyle = `rgba(${color},${alpha})`;
  ctx.lineWidth = width;
  ctx.stroke();
  ctx.restore();
}

function chalkCircle(cx, cy, r, width = 2, color = COL.chalk, alpha = 0.9) {
  ctx.save();
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let a = 0; a <= Math.PI*2 + 0.1; a += 0.08) {
    const x = cx + Math.cos(a)*r + (Math.random()-0.5)*1.8;
    const y = cy + Math.sin(a)*r + (Math.random()-0.5)*1.8;
    if (a === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.strokeStyle = `rgba(${color},${alpha*0.3})`;
  ctx.lineWidth = width + 3;
  ctx.stroke();
  ctx.strokeStyle = `rgba(${color},${alpha})`;
  ctx.lineWidth = width;
  ctx.stroke();
  ctx.restore();
}

/* ===== Polvo de tiza ===== */
const chalkDust = [];
function spawnDust(x, y, count = 3, color = COL.chalk) {
  for (let i = 0; i < count; i++) {
    chalkDust.push({
      x: x + (Math.random()-0.5)*12,
      y: y + (Math.random()-0.5)*5,
      vx: (Math.random()-0.5)*0.4,
      vy: 0.2 + Math.random()*0.5,
      life: 1,
      size: Math.random()*1.8 + 0.5,
      color
    });
  }
}
function updateDust() {
  for (let i = chalkDust.length - 1; i >= 0; i--) {
    const d = chalkDust[i];
    d.x += d.vx; d.y += d.vy;
    d.vy *= 0.98;
    d.life -= 0.012;
    if (d.life <= 0) chalkDust.splice(i, 1);
  }
}
function drawDust() {
  chalkDust.forEach(d => {
    ctx.fillStyle = `rgba(${d.color},${d.life*0.4})`;
    ctx.fillRect(d.x, d.y, d.size, d.size);
  });
}

/* ===== Vapor de la papa ===== */
const smokeWisps = [];
function spawnSmoke() {
  smokeWisps.push({
    x: W/2 + (Math.random()-0.5)*70,
    y: H*0.78 - 48,
    vx: (Math.random()-0.5)*0.12,
    vy: -0.12 - Math.random()*0.18,
    life: 1,
    size: 5 + Math.random()*8,
    maxSize: 25 + Math.random()*15
  });
}
function updateSmoke() {
  for (let i = smokeWisps.length - 1; i >= 0; i--) {
    const s = smokeWisps[i];
    s.x += s.vx; s.y += s.vy;
    s.vx *= 0.995; s.vy *= 0.998;
    s.size += 0.25;
    if (s.size > s.maxSize) s.size = s.maxSize;
    s.life -= 0.005;
    if (s.life <= 0) smokeWisps.splice(i, 1);
  }
}
function drawSmoke() {
  smokeWisps.forEach(s => {
    const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size);
    grad.addColorStop(0,   `rgba(245,240,235,${s.life*0.35})`);
    grad.addColorStop(0.4, `rgba(240,235,228,${s.life*0.2})`);
    grad.addColorStop(1,   'rgba(240,235,228,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
    ctx.fill();
  });
}

/* ===== Granos ===== */
let grains = [];
function initGrains() {
  grains = [];
  for (let i = 0; i < 80; i++) {
    grains.push({
      x: (Math.random()-0.5) * 100,
      startY: H*0.55 + Math.random()*15,
      endY: H*0.78 - 35 + Math.random()*30,
      delay: Math.random() * 0.6,
      size: 1.5 + Math.random()*1.2
    });
  }
}
initGrains();

const interiorDots = [];
for (let i = 0; i < 25; i++) {
  interiorDots.push({ x: -90 + Math.random()*180, y: -50 + Math.random()*45 });
}

/* ===== Brisket ===== */
let brisketChunks = [];
function initBrisket() {
  brisketChunks = [];
  for (let i = 0; i < 14; i++) {
    brisketChunks.push({
      x: (Math.random()-0.5) * 110,
      finalY: H*0.78 - 80 + Math.random()*35,
      startY: H*0.35 + Math.random()*40,
      delay: Math.random() * 0.7,
      w: 12 + Math.random()*14,
      h: 8 + Math.random()*10,
      rot: (Math.random()-0.5)*0.5
    });
  }
}
initBrisket();

/* ===== Camino salsa BBQ ===== */
const saucePath = [];
let saucePathBuilt = false;
function buildSaucePath() {
  if (saucePathBuilt) return;
  saucePathBuilt = true;
  let x = W/2 - 70;
  let y = H*0.78 - 100;
  while (x < W/2 + 70) {
    saucePath.push({x, y});
    x += 4 + Math.random()*3;
    y += (Math.random()-0.5)*8;
    if (y < H*0.78 - 110) y = H*0.78 - 110;
    if (y > H*0.78 - 80)  y = H*0.78 - 80;
  }
}

/* ===== Papa ===== */
function drawPotato(progress) {
  if (progress <= 0) return;
  const p = Math.min(progress, 1);
  const cx = W/2, cy = H*0.78;
  const rx = 130, ry = 70;

  ctx.fillStyle = `rgba(0,0,0,${0.45*p})`;
  ctx.beginPath();
  ctx.ellipse(cx, cy + ry + 8, rx * 0.85 * p, 9, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = `rgba(${COL.cream},${0.92*p})`;
  ctx.lineWidth = 3;
  ctx.beginPath();
  const segments = 64;
  const maxSeg = Math.floor(segments * p);
  for (let i = 0; i <= maxSeg; i++) {
    const a = (i / segments) * Math.PI * 2;
    const wobble = Math.sin(a*3)*8 + Math.cos(a*5)*5;
    const x = cx + Math.cos(a)*(rx + wobble);
    const y = cy + Math.sin(a)*(ry + wobble*0.5);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  if (p >= 1) ctx.closePath();
  ctx.stroke();
  ctx.restore();

  if (p > 0.5) {
    const dots = [
      [-60,20],[-30,35],[10,30],[50,25],[80,10],
      [-70,40],[-40,50],[0,55],[40,50],[70,45],
      [-50,5],[-10,10],[-40,-10],[50,-5],
      [-20,60],[20,60],[-60,60],[60,60]
    ];
    dots.forEach(([dx, dy]) => {
      ctx.fillStyle = `rgba(${COL.brown},${0.5*p})`;
      ctx.fillRect(cx + dx, cy + dy, 2, 2);
    });
  }

  if (p > 0.7) {
    const ip = Math.min(1, (p - 0.7) / 0.3);
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, cy - 25, 95, 28, 0, 0, Math.PI*2);
    ctx.fillStyle = `rgba(0,0,0,${0.65*ip})`;
    ctx.fill();
    ctx.clip();
    interiorDots.forEach(d => {
      ctx.fillStyle = `rgba(${COL.darkbrown},${0.22*ip})`;
      ctx.fillRect(cx + d.x, cy + d.y, 2, 2);
    });
    ctx.restore();

    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = `rgba(${COL.cream},${0.8*ip})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(cx - 90, cy - 30);
    ctx.quadraticCurveTo(cx - 40, cy - 58, cx, cy - 48);
    ctx.quadraticCurveTo(cx + 40, cy - 58, cx + 90, cy - 30);
    ctx.stroke();

    ctx.strokeStyle = `rgba(${COL.cream},${0.25*ip})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - 80, cy - 28);
    ctx.quadraticCurveTo(cx - 40, cy - 53, cx, cy - 45);
    ctx.quadraticCurveTo(cx + 40, cy - 53, cx + 80, cy - 28);
    ctx.stroke();
    ctx.restore();
  }
}

/* ===== Mantequilla ===== */
function drawButter(progress) {
  if (progress <= 0) return;
  const p = Math.min(progress, 1);
  const cx = W/2, cy = H*0.78 - 35;
  const size = 30;
  ctx.save();
  ctx.globalAlpha = p;
  ctx.strokeStyle = `rgba(${COL.yellow},0.95)`;
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.fillStyle = `rgba(${COL.yellow},0.2)`;

  ctx.beginPath();
  ctx.moveTo(cx - size*0.7, cy - size*0.3);
  ctx.lineTo(cx, cy - size*0.6);
  ctx.lineTo(cx + size*0.7, cy - size*0.3);
  ctx.lineTo(cx, cy);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx - size*0.7, cy - size*0.3);
  ctx.lineTo(cx, cy);
  ctx.lineTo(cx, cy + size*0.5);
  ctx.lineTo(cx - size*0.7, cy + size*0.2);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + size*0.7, cy - size*0.3);
  ctx.lineTo(cx + size*0.7, cy + size*0.2);
  ctx.lineTo(cx, cy + size*0.5);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

/* ╔═══════════════════════════════════════════════════╗ */
/* ║  SALERO — con rotación para inclinación + shake   ║ */
/* ╚═══════════════════════════════════════════════════╝ */
function drawShaker(sx, sy, alpha, label, rot) {
  rot = rot || 0;
  ctx.save();
  ctx.globalAlpha = alpha;

  /* Rotar alrededor del centro del salero */
  if (rot !== 0) {
    ctx.translate(sx, sy);
    ctx.rotate(rot);
    ctx.translate(-sx, -sy);
  }

  ctx.strokeStyle = `rgba(${COL.chalk},0.85)`;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.fillStyle = `rgba(${COL.chalk},0.05)`;

  /* Cuerpo trapezoidal */
  ctx.beginPath();
  ctx.moveTo(sx - 18, sy - 18);
  ctx.lineTo(sx + 18, sy - 18);
  ctx.lineTo(sx + 14, sy + 26);
  ctx.lineTo(sx - 14, sy + 26);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  /* Tapa */
  ctx.beginPath();
  ctx.moveTo(sx - 18, sy - 18);
  ctx.lineTo(sx - 16, sy - 24);
  ctx.lineTo(sx + 16, sy - 24);
  ctx.lineTo(sx + 18, sy - 18);
  ctx.closePath();
  ctx.stroke();

  /* Agujeros */
  ctx.fillStyle = `rgba(${COL.chalk},0.85)`;
  for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) {
    ctx.fillRect(sx - 8 + i*8, sy - 22 + j*4, 2, 2);
  }

  /* Etiqueta */
  ctx.fillStyle = `rgba(${COL.chalk},0.85)`;
  ctx.font = 'bold 12px Courier New';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, sx, sy + 5);
  ctx.restore();
}

/* ╔═══════════════════════════════════════════════════╗ */
/* ║  SAL Y PIMIENTA                                    ║ */
/* ║                                                      ║ */
/* ║  ══ INCLINACIÓN PERMANENTE ══                       ║ */
/* ║  • S (izq) inclina hacia la DERECHA = hacia centro  ║ */
/* ║  • P (der) inclina hacia la IZQUIERDA = hacia centro║ */
/* ║  • Ángulo base: 0.32 rad (~18°) siempre aplicado    ║ */
/* ║                                                      ║ */
/* ║  ══ SHAKE (vibración) solo mientras caen granos ══   ║ */
/* ║  • Se suma a la inclinación base                    ║ */
/* ║  • Amplitud disminuye al final                       ║ */
/* ╚═══════════════════════════════════════════════════╝ */
function drawSaltPepper(progress) {
  if (progress <= 0) return;
  const p = Math.min(progress, 1);
  const cx = W/2;

  /* Granos cayendo */
  grains.forEach(g => {
    const lp = Math.max(0, Math.min(1, (p - g.delay) / (1 - g.delay)));
    if (lp <= 0) return;
    const y = g.startY + (g.endY - g.startY) * easeOut(lp);
    ctx.fillStyle = `rgba(${COL.chalk},0.85)`;
    ctx.fillRect(cx + g.x, y, g.size, g.size);
  });

  /* Shakers */
  if (p > 0.35) {
    const sp = Math.min(1, (p - 0.35) / 0.65);

    /* ─── Inclinación base PERMANENTE hacia el centro ─── */
    const TILT_BASE = 0.32;             /* ~18° siempre */
    const tiltS = TILT_BASE;             /* S: + = horario = derecha → centro */
    const tiltP = -TILT_BASE;            /* P: - = antihorario = izquierda → centro */

    /* ─── Shake: vibración temporal (solo mientras cae) ─── */
    let sX = 0, sRot = 0, sY = 0;

    if (p < 0.98) {
      const freq  = p * 75;
      const decay = 1 - p * 0.4;
      const amp   = 7 * decay;

      sX   = Math.abs(Math.sin(freq)) * amp;        /* empuja X hacia adentro */
      sRot = Math.sin(freq * 1.2) * 0.14 * decay;   /* vibración rotacional */
      sY   = Math.abs(Math.sin(freq * 0.7)) * 2.5 * decay;  /* bob vertical */
    }

    /* ═══ Salero izquierdo "S" ═══
       Posición base: cx - 110
       Inclinación:   +0.32 rad (hacia la derecha = centro)
       Shake:         añade sRot (oscila) y sX (empuja derecha) */
    drawShaker(
      cx - 110 + sX,        /* X: base + empuje inward */
      H*0.52 - sY,         /* Y: bob */
      sp,                   /* alpha */
      'S',
      tiltS + sRot          /* rotación: inclinación base + shake */
    );

    /* ═══ Pimentero derecho "P" ═══
       Posición base: cx + 110
       Inclinación:   -0.32 rad (hacia la izquierda = centro)
       Shake:         añade -sRot (oscila opuesto) y -sX (empuja izquierda) */
    drawShaker(
      cx + 110 - sX,        /* X: base - empuje inward */
      H*0.52 - sY,         /* Y: bob */
      sp,
      'P',
      tiltP - sRot          /* rotación: inclinación base + shake (opuesto) */
    );
  }
}

/* ===== Queso ===== */
function drawCheese(progress) {
  if (progress <= 0) return;
  const p = Math.min(progress, 1);
  const cx = W/2, cy = H*0.78 - 50;
  ctx.save();
  ctx.globalAlpha = p;
  ctx.strokeStyle = `rgba(${COL.yellow},0.95)`;
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.fillStyle = `rgba(${COL.yellow},0.3)`;

  const cw = 110, ch = 20;
  ctx.beginPath();
  ctx.moveTo(cx - cw/2, cy - ch);
  ctx.quadraticCurveTo(cx - cw/3, cy - ch - 12, cx - cw/6, cy - ch - 6);
  ctx.quadraticCurveTo(cx, cy - ch - 18, cx + cw/6, cy - ch - 6);
  ctx.quadraticCurveTo(cx + cw/3, cy - ch - 12, cx + cw/2, cy - ch);

  const drips = [{x:-35,len:28},{x:-12,len:38},{x:8,len:32},{x:30,len:22},{x:45,len:14}];
  drips.forEach(d => {
    const dl = d.len * p;
    ctx.lineTo(cx + d.x + 4, cy - ch + dl - 5);
    ctx.quadraticCurveTo(cx + d.x + 4, cy - ch + dl + 4, cx + d.x, cy - ch + dl);
    ctx.lineTo(cx + d.x - 4, cy - ch + dl - 3);
  });
  ctx.lineTo(cx + cw/2 - 8, cy - ch);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

/* ===== Brisket ===== */
function drawBrisket(progress) {
  if (progress <= 0) return;
  const p = Math.min(progress, 1);
  const cx = W/2;
  brisketChunks.forEach(c => {
    const lp = Math.max(0, Math.min(1, (p - c.delay) / (1 - c.delay)));
    if (lp <= 0) return;
    const eased = easeOut(lp);
    const y = c.startY + (c.finalY - c.startY) * eased;
    const x = cx + c.x;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(c.rot);
    ctx.globalAlpha = Math.min(1, eased * 1.5);
    ctx.fillStyle = `rgba(${COL.brown},0.85)`;
    ctx.strokeStyle = `rgba(${COL.darkbrown},0.95)`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-c.w/2, -c.h/2);
    ctx.lineTo(c.w/2 - 2, -c.h/2);
    ctx.lineTo(c.w/2, 0);
    ctx.lineTo(c.w/2 - 1, c.h/2);
    ctx.lineTo(-c.w/2 + 1, c.h/2);
    ctx.lineTo(-c.w/2, 0);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = `rgba(${COL.chalk},0.5)`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-c.w/2 + 2, -1);
    ctx.lineTo(c.w/2 - 3, 1);
    ctx.stroke();
    ctx.restore();
  });
}

/* ===== Salsa BBQ ===== */
function drawSauce(progress) {
  if (progress <= 0) return;
  const p = Math.min(progress, 1);
  buildSaucePath();
  if (saucePath.length < 2) return;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const totalSegs = saucePath.length - 1;
  const drawSegs = Math.max(0, Math.floor(totalSegs * p));

  ctx.strokeStyle = `rgba(${COL.darkbrown},0.4)`;
  ctx.lineWidth = 12;
  ctx.beginPath();
  ctx.moveTo(saucePath[0].x, saucePath[0].y);
  for (let i = 1; i <= drawSegs; i++) ctx.lineTo(saucePath[i].x, saucePath[i].y);
  ctx.stroke();

  ctx.strokeStyle = `rgba(${COL.red},0.92)`;
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(saucePath[0].x, saucePath[0].y);
  for (let i = 1; i <= drawSegs; i++) ctx.lineTo(saucePath[i].x, saucePath[i].y);
  ctx.stroke();

  ctx.strokeStyle = `rgba(${COL.red},0.4)`;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(saucePath[0].x, saucePath[0].y - 1);
  for (let i = 1; i <= drawSegs; i++) ctx.lineTo(saucePath[i].x, saucePath[i].y - 1);
  ctx.stroke();

  if (p > 0.7 && drawSegs < totalSegs) {
    const last = saucePath[drawSegs];
    const dripLen = (p - 0.7) / 0.3 * 15;
    ctx.strokeStyle = `rgba(${COL.red},0.92)`;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(last.x, last.y + dripLen);
    ctx.stroke();
  }
  ctx.restore();
}

/* ===== Título ===== */
function drawTitle(t) {
  if (t <= 0.88) return;
  const tp = easeOut(Math.min((t - 0.88) / 0.12, 1));
  ctx.save();
  ctx.globalAlpha = tp;
  ctx.translate(0, (1 - tp) * -20);
  ctx.textAlign = 'center';

  ctx.strokeStyle = `rgba(${COL.yellow},${tp*0.5})`;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(W/2 - 160, 115);
  ctx.lineTo(W/2 + 160, 115);
  ctx.stroke();

  ctx.fillStyle = `rgba(${COL.chalk},${tp})`;
  ctx.font = 'bold 28px Courier New';
  ctx.fillText('LA PAPA RELLENA BBQ', W/2, 90);

  ctx.font = '13px Courier New';
  ctx.fillStyle = `rgba(${COL.chalk},${tp*0.85})`;
  ctx.fillText('COMPRA UNA Y LA SEGUNDA', W/2, 138);

  ctx.font = 'bold 14px Courier New';
  ctx.fillStyle = `rgba(${COL.orange},${tp})`;
  ctx.fillText('ES 50% DE DESCUENTO', W/2, 156);

  ctx.font = '13px Courier New';
  ctx.fillStyle = `rgba(${COL.yellow},${tp*0.8})`;
  ctx.fillText('★  ★  ★', W/2, 176);
  ctx.restore();
}

/* ===== Loop ===== */
function loop(ts) {
  if (!startTime) startTime = ts;
  const elapsed = ts - startTime;
  const t = Math.min(elapsed / DURATION, 1);

  ctx.drawImage(bgCanvas, 0, 0);

  const potatoP = easeOut(Math.min(t / 0.16, 1));

  updateSmoke();
  drawSmoke();

  if (potatoP > 0.7) {
    const steamRate = t >= 1 ? 0.22 : 0.14;
    if (Math.random() < steamRate) spawnSmoke();
  }

  updateDust();
  drawDust();

  drawPotato(potatoP);

  const bStart = 0.16, bEnd = 0.29;
  const bRaw = t > bStart ? Math.min((t - bStart) / (bEnd - bStart), 1) : 0;
  const bP = easeOut(bRaw);
  if (bP > 0) {
    const dropOffset = (1 - bP) * -180;
    ctx.save();
    ctx.translate(0, dropOffset);
    drawButter(Math.min(bP * 1.5, 1));
    ctx.restore();
    if (bP > 0.9 && bP < 1 && Math.random() < 0.6) spawnDust(W/2, H*0.78 - 35, 2, COL.yellow);
  }

  const spStart = 0.29, spEnd = 0.42;
  const spP = t > spStart ? Math.min((t - spStart) / (spEnd - spStart), 1) : 0;
  drawSaltPepper(spP);
  if (spP > 0.15 && spP < 1 && Math.random() < 0.3) {
    spawnDust(W/2 + (Math.random()-0.5)*100, H*0.55, 1);
  }

  const cStart = 0.42, cEnd = 0.58;
  const cP = t > cStart ? easeInOut(Math.min((t - cStart) / (cEnd - cStart), 1)) : 0;
  drawCheese(cP);

  const brStart = 0.58, brEnd = 0.74;
  const brP = t > brStart ? Math.min((t - brStart) / (brEnd - brStart), 1) : 0;
  drawBrisket(brP);
  if (brP > 0.5 && brP < 1 && Math.random() < 0.4) {
    spawnDust(W/2 + (Math.random()-0.5)*80, H*0.78 - 80, 2, COL.brown);
  }

  const saStart = 0.74, saEnd = 0.89;
  const saP = t > saStart ? Math.min((t - saStart) / (saEnd - saStart), 1) : 0;
  drawSauce(saP);

  drawTitle(t);

  requestAnimationFrame(loop);
}

function restartAnim() {
  startTime = null;
  chalkDust.length = 0;
  smokeWisps.length = 0;
  initGrains();
  initBrisket();
  saucePath.length = 0;
  saucePathBuilt = false;
}

function orderNow() {
  const msg = encodeURIComponent(
    '🔥 Hola Da bbq Pit! Quiero ordenar La Papa Rellena BBQ ' +
    '(' + PRECIO_OFERTA + '). ' +
    'Compra una y la segunda con 50% de descuento.'
  );
  window.open('https://wa.me/' + WHATSAPP + '?text=' + msg, '_blank');
}

requestAnimationFrame(loop);
